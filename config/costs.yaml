# General, non-promotional KIS cost assumptions for listed stocks (2026-07-16).
# 1 bp = 0.01%. Replace commission/FX values if the account has negotiated or event rates.
KR:
  initial_cash: 3000000
  # BanKIS KRX online stock commission: 0.0140527% per side.
  commission_bps_each_side: 1.40527
  slippage_bps_each_side: 5
  # 2026 listed-stock sell tax: KOSPI 0.05% + rural tax 0.15%; KOSDAQ 0.20%.
  sell_tax_bps: 20
  fx_bps_each_side: 0
  trade_risk_pct: 0.4
  daily_loss_limit_pct: 2.0
  max_position_quantity: 1000
  fill_latency_ms: 300
  fill_timeout_sec: 5
  allow_partial_fill: true
  max_fill_quantity_per_tick: 100
  volume_participation_pct: 10
  max_order_submissions_per_day: 4
  max_filled_entries_per_day: 2
  consecutive_stop_limit: 2
  stop_cooldown_minutes: 20
  halt_resume_cooldown_seconds: 60
  max_spread_pct: 1.0
  max_tick_age_seconds: 3
  indicator_max_age_seconds: 3
US:
  initial_cash: 1500
  # KIS standard online US stock commission: 0.25% per side (promotions excluded).
  commission_bps_each_side: 25
  slippage_bps_each_side: 5
  # SEC Fee: 0.00206% of sell notional. Share-based regulatory fees are not modeled here.
  sell_tax_bps: 0.206
  # Conservative FX-spread assumption. Set to 0 when trading from an existing USD balance.
  fx_bps_each_side: 10
  trade_risk_pct: 0.4
  daily_loss_limit_pct: 2.0
  max_position_quantity: 100
  fill_latency_ms: 300
  fill_timeout_sec: 5
  allow_partial_fill: true
  max_fill_quantity_per_tick: 25
  volume_participation_pct: 10
  max_order_submissions_per_day: 4
  max_filled_entries_per_day: 2
  consecutive_stop_limit: 2
  stop_cooldown_minutes: 20
  halt_resume_cooldown_seconds: 60
  max_spread_pct: 1.0
  max_tick_age_seconds: 3
  indicator_max_age_seconds: 3
